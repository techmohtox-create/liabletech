<app-header />

<main id="top">
  @if (content(); as c) {
    <app-hero [hero]="c.hero" [steps]="c.process" />
    <app-services [services]="c.services" />
    <app-approach [principles]="c.principles" [technologies]="c.technologies" />
    <app-process [steps]="c.process" />
    <app-contact [contact]="c.contact" [services]="c.services" />
  } @else if (failed()) {
    <section class="state on-ink" role="alert">
      <h1>We couldn't load the page.</h1>
      <p>Please check your connection and try again.</p>
      <button class="btn btn-primary" type="button" (click)="reload()">Try again</button>
    </section>
  } @else {
    <section class="state on-ink" aria-busy="true">
      <span class="spinner"></span>
      <span class="sr-only">Loading</span>
    </section>
  }
</main>

<app-footer [email]="content()?.contact?.email" />
