<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(${tripId == null ? 'Add a trip' : 'Edit trip'}, ~{::content})}">
<body>
<div th:fragment="content">
  <div class="breadcrumb"><a th:href="@{/trips}">Trips</a> /</div>
  <h1 th:text="${tripId == null ? 'Add a trip' : 'Edit trip'}">Trip</h1>
  <form th:action="${tripId == null} ? @{/trips} : @{/trips/{id}(id=${tripId})}" th:object="${form}" method="post" class="card stack">
    <div class="form-grid">
      <div class="field"><label for="lrNumber">LR number</label><input type="text" id="lrNumber" th:field="*{lrNumber}" th:errorclass="invalid"></div>
      <div class="field"><label for="lrDate">LR date</label><input type="date" id="lrDate" th:field="*{lrDate}"></div>
      <div class="field">
        <label for="partyId">Bill to</label>
        <select id="partyId" th:field="*{partyId}">
          <option value="">Choose…</option>
          <option th:each="p : ${parties}" th:value="${p.id}" th:text="${p.name}">party</option>
        </select>
        <span class="hint"><a th:href="@{/parties/new}">Add a party</a></span>
      </div>
      <div class="field">
        <label for="vehicleId">Truck</label>
        <select id="vehicleId" th:field="*{vehicleId}">
          <option value="">Choose…</option>
          <option th:each="v : ${vehicles}" th:value="${v.id}" th:text="${v.label()}">truck</option>
        </select>
      </div>
      <div class="field">
        <label for="driverId">Driver</label>
        <select id="driverId" th:field="*{driverId}">
          <option value="">Choose…</option>
          <option th:each="d : ${drivers}" th:value="${d.id}" th:text="${d.name}">driver</option>
        </select>
      </div>
      <div class="field"><label for="origin">From</label><input type="text" id="origin" th:field="*{origin}"></div>
      <div class="field"><label for="destination">To</label><input type="text" id="destination" th:field="*{destination}"></div>
      <div class="field"><label for="consignee">Consignee</label><input type="text" id="consignee" th:field="*{consignee}"></div>
      <div class="field"><label for="goods">Goods</label><input type="text" id="goods" th:field="*{goods}"></div>
      <div class="field"><label for="freightAmount">Freight ₹</label><input type="number" step="0.01" min="0" id="freightAmount" th:field="*{freightAmount}" th:errorclass="invalid"></div>
      <div class="field"><label for="advanceAmount">Advance received ₹</label><input type="number" step="0.01" min="0" id="advanceAmount" th:field="*{advanceAmount}"></div>
      <div class="field"><label for="detentionAmount">Detention ₹</label><input type="number" step="0.01" min="0" id="detentionAmount" th:field="*{detentionAmount}"></div>
      <div class="field"><label for="otherCharges">Other charges ₹</label><input type="number" step="0.01" min="0" id="otherCharges" th:field="*{otherCharges}"></div>
      <div class="field"><label for="deliveredOn">Delivered on</label><input type="date" id="deliveredOn" th:field="*{deliveredOn}">
        <span class="hint">Leave empty while on the road; the driver's POD fills it in.</span></div>
      <div class="field wide"><label for="notes">Notes</label><textarea id="notes" th:field="*{notes}" rows="2"></textarea></div>
    </div>
    <div class="actions"><button type="submit" class="btn primary">Save trip</button><a class="btn" th:href="@{/trips}">Back</a></div>
  </form>
</div>
</body>
</html>
