spring.application.name=part-finder
server.port=${PORT:8085}

app.brand.name=Part Finder
app.brand.tagline=Mechanics send a photo, voice note or message of the part they need. It is identified, matched to your stock and answered in seconds, because the shop that answers first gets the sale.
app.brand.accent=#b45309
app.brand.plan=₹299 per month, Pro ₹499

app.demo.email=owner@parts.demo
app.demo.password=demo@123

# Speech-to-text for voice notes: any service with an OpenAI-compatible /v1/audio/transcriptions
# endpoint, such as a self-hosted Whisper server. Off when empty: voice notes are played at the counter.
app.stt.url=${STT_URL:}
app.stt.api-key=${STT_API_KEY:}
app.stt.model=${STT_MODEL:whisper-1}
app.stt.language=${STT_LANGUAGE:}

# How often waiting enquiries are checked for the owner's nudge.
app.nudge.every=PT30S
