<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Create account', ~{::content})}">
<body>
<div th:fragment="content" class="auth">
  <a class="brand" th:href="@{/}"><span class="brand-mark" th:text="${#strings.substring(brand.name, 0, 1)}">A</span>
    <span th:text="${brand.name}">App</span></a>
  <p class="tagline"><span th:text="${brand.plan}">Plan</span> · free trial, no card needed</p>
  <div class="card">
    <form th:action="@{/signup}" th:object="${form}" method="post" class="stack">
      <div class="field">
        <label for="businessName">Business name</label>
        <input type="text" id="businessName" th:field="*{businessName}" th:errorclass="invalid" required>
        <span class="err" th:if="${#fields.hasErrors('businessName')}" th:errors="*{businessName}"></span>
      </div>
      <div class="field">
        <label for="ownerName">Your name</label>
        <input type="text" id="ownerName" th:field="*{ownerName}" th:errorclass="invalid" required>
        <span class="err" th:if="${#fields.hasErrors('ownerName')}" th:errors="*{ownerName}"></span>
      </div>
      <div class="field">
        <label for="phone">Mobile (WhatsApp)</label>
        <input type="tel" id="phone" th:field="*{phone}" th:errorclass="invalid" placeholder="98765 43210" required>
        <span class="err" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" th:field="*{email}" th:errorclass="invalid" required>
        <span class="err" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" th:field="*{password}" th:errorclass="invalid" autocomplete="new-password" required>
        <span class="err" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
      </div>
      <button type="submit" class="btn primary block">Create account</button>
    </form>
  </div>
  <p class="center">Already registered? <a th:href="@{/login}">Sign in</a></p>
</div>
</body>
</html>
