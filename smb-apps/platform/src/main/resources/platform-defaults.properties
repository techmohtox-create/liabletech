# Defaults shared by every app. An app's own application.properties, environment variables and
# command-line arguments all override these.

# Local data: an H2 database file and uploaded photos/PDFs live under app.data-dir.
# Production sets SPRING_DATASOURCE_URL/USERNAME/PASSWORD (PostgreSQL) instead.
app.data-dir=./data
spring.datasource.url=jdbc:h2:file:${app.data-dir}/db/${spring.application.name};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.locations=classpath:db/migration/platform,classpath:db/migration/app

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
server.servlet.session.timeout=12h
server.error.whitelabel.enabled=false
management.endpoints.web.exposure.include=health

# Business dates (due dates, renewals, follow-ups) are Indian Standard Time.
app.timezone=Asia/Kolkata

# Links sent to customers (booking pages) start with this. Set it to the public URL when deployed.
app.public-base-url=http://localhost:${server.port}

# Demo account and sample data, created on first start. Turn off for real use.
app.demo.enabled=true

# Reading photos and PDFs with Claude. Without an API key the apps still work: every document
# goes to a review screen where the fields are typed in by hand.
app.ai.api-key=${ANTHROPIC_API_KEY:}
app.ai.model=claude-opus-5-5
app.ai.effort=medium
app.ai.max-tokens=16000
app.ai.timeout=PT3M
app.ai.fallbacks=true

# WhatsApp: "simulator" keeps everything local (see /dev/whatsapp); "cloud" uses the
# WhatsApp Business Cloud API with the settings below.
app.whatsapp.mode=simulator
app.whatsapp.graph-version=v23.0
app.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
app.whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.use-templates=false
app.whatsapp.template-language=en

# Email goes out only when SPRING_MAIL_HOST is set; otherwise it is recorded in the outbox.
# With `docker compose up mailpit` use SPRING_MAIL_HOST=localhost and SPRING_MAIL_PORT=1025.
app.mail.from=${APP_MAIL_FROM:no-reply@localhost}
