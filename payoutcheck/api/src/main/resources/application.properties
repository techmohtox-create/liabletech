spring.application.name=payoutcheck
server.port=${PORT:8080}

# Local use keeps data in a file database under ./data. Production sets SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD for PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/payoutcheck;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.locations=classpath:db/migration

server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${PAYOUTCHECK_SECURE_COOKIES:false}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.compression.enabled=true
server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Demo business (demo@payoutcheck.local / demo1234) with four weeks of orders and statements.
payoutcheck.demo.enabled=${PAYOUTCHECK_DEMO:true}
