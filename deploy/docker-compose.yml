services:
  bff:
    build: ../bff
    restart: unless-stopped
    env_file: .env
    environment:
      LIABLETECH_CORS_ALLOWED_ORIGINS: https://liabletech.com,https://www.liabletech.com
      SERVER_FORWARD_HEADERS_STRATEGY: native
    mem_limit: 384m
    expose:
      - "8080"

  # BazaarFlow live demo (liabletech.com/ecommerce). The jar is built on a PC and copied here;
  # see bazaarflow/Dockerfile. Secrets live in bazaarflow.env, which is not committed.
  bazaarflow:
    build: ./bazaarflow
    restart: unless-stopped
    env_file: bazaarflow.env
    environment:
      BAZAARFLOW_DEMO: "true"
      BAZAARFLOW_CORS_ORIGINS: https://liabletech.com,https://www.liabletech.com
      BAZAARFLOW_API_DOCS: "false"
      BAZAARFLOW_ACTUATOR_EXPOSE: health
      BAZAARFLOW_DB_POOL_MAX: "4"
      BAZAARFLOW_DB_POOL_MIN_IDLE: "0"
      BAZAARFLOW_DB_IDLE_TIMEOUT_MS: "60000"
      BAZAARFLOW_DB_MAX_LIFETIME_MS: "300000"
      SERVER_FORWARD_HEADERS_STRATEGY: native
    mem_limit: 448m
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - bff
      - bazaarflow
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
