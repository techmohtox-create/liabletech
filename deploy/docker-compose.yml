services:
  bff:
    build: ../bff
    restart: unless-stopped
    env_file: .env
    environment:
      LIABLETECH_CORS_ALLOWED_ORIGINS: https://liabletech.com,https://www.liabletech.com
      SERVER_FORWARD_HEADERS_STRATEGY: native
    mem_limit: 384m
    expose:
      - "8080"

  # BazaarFlow live demo (liabletech.com/ecommerce). The jar is built on a PC and copied here;
  # see bazaarflow/Dockerfile. The demo keeps its data in an in-memory H2 database inside the
  # app: queries take microseconds instead of a round trip to Neon, and a restart reseeds it.
  bazaarflow:
    build: ./bazaarflow
    restart: unless-stopped
    env_file: bazaarflow.env          # OBENOL_JWT_SECRET
    environment:
      SPRING_PROFILES_ACTIVE: h2
      SPRING_DATASOURCE_URL: jdbc:h2:mem:bazaarflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
      SPRING_H2_CONSOLE_ENABLED: "false"
      BAZAARFLOW_DEMO: "true"
      BAZAARFLOW_CORS_ORIGINS: https://liabletech.com,https://www.liabletech.com
      BAZAARFLOW_API_DOCS: "false"
      BAZAARFLOW_ACTUATOR_EXPOSE: health
      SERVER_FORWARD_HEADERS_STRATEGY: native
    mem_limit: 448m
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - bff
      - bazaarflow
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
