services:
  bff:
    build: ../bff
    restart: unless-stopped
    environment:
      LIABLETECH_CORS_ALLOWED_ORIGINS: https://liabletech.com,https://www.liabletech.com
      SERVER_FORWARD_HEADERS_STRATEGY: native
    mem_limit: 512m
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - bff
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
