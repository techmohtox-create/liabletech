spring.application.name=bff
server.port=8080

management.endpoints.web.exposure.include=health

# Production sets SPRING_DATASOURCE_URL/USERNAME/PASSWORD (PostgreSQL). Without them an in-memory H2 is used.
spring.sql.init.mode=always
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000

# Lead notifications: every enquiry and waitlist sign-up is emailed to this address.
# Sending is on only when SPRING_MAIL_HOST is set (production); otherwise it is skipped and logged.
# Mail is hosted by Zoho: smtp.zoho.in, port 465 with SSL, AUTH LOGIN (Zoho stalls on AUTH PLAIN).
liabletech.leads.notify-to=${LIABLETECH_LEADS_NOTIFY_TO:contact@liabletech.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.auth.mechanisms=LOGIN
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
